# Rilascio automatico su tag (facoltativo).
#
# Si attiva solo se hai caricato i segreti della firma nelle impostazioni
# del repository: Settings -> Secrets and variables -> Actions.
#   KEYSTORE_BASE64   l'archivio .jks codificato in base64
#   KEYSTORE_PASSWORD la password dell'archivio
#   KEY_ALIAS         il nome della chiave
#   KEY_PASSWORD      la password della chiave
#
# Senza i segreti il lavoro viene saltato: puoi tranquillamente compilare
# e caricare l'APK a mano da Android Studio, e' altrettanto valido.

name: Release

on:
  push:
    tags: [ 'v*' ]

jobs:
  release:
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner != '' }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ricostruisci l'archivio chiavi dai segreti
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } > keystore.properties

      - name: Compila l'APK di rilascio
        run: |
          if [ -x ./gradlew ]; then ./gradlew assembleRelease --no-daemon
          else gradle assembleRelease --no-daemon; fi

      - name: Cancella le credenziali dal runner
        if: always()
        run: rm -f release.jks keystore.properties

      - name: Allega l'APK al rilascio
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
